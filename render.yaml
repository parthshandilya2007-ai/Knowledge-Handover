services:
  # Temporary demo backend. Uses an in-memory MongoDB; all data is lost on restart/redeploy.
  - type: web
    name: knowledge-handover-backend
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: backend
    buildCommand: npm install --include=dev && npm run build
    startCommand: npm run start
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: USE_IN_MEMORY_DB
        value: "true"
      - key: CLIENT_URL
        value: https://knowledge-handover-bigy-am7oy5qj-codelith1.vercel.app
      - key: STORAGE_DRIVER
        value: local
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_REFRESH_SECRET
        generateValue: true
      - key: INTERNAL_SERVICE_KEY
        generateValue: true
      - key: WEBHOOK_HMAC_SECRET
        generateValue: true
      - key: TOKEN_ENCRYPTION_KEY
        generateValue: true
